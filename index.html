<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f5f0e8" />
  <title>食好好</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1612;
      --ink-soft: #5c5348;
      --cream: #f5f0e8;
      --cream-deep: #e8dfd0;
      --paper: #faf7f2;
      --leaf: #2d8f5e;
      --leaf-deep: #1a7f4b;
      --amber: #c47a00;
      --fail: #c0392b;
      --line: rgba(26, 22, 18, 0.08);
      --shadow: 0 16px 36px rgba(26, 22, 18, 0.08);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-brand: "Ma Shan Zheng", "Songti SC", serif;
      --font-ui: "Noto Sans SC", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--font-ui);
      color: var(--ink);
      background: var(--cream);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(100% 70% at 0% -5%, rgba(45, 143, 94, 0.14), transparent 55%),
        radial-gradient(80% 50% at 100% 0%, rgba(196, 122, 0, 0.1), transparent 50%),
        linear-gradient(180deg, #f8f4ec 0%, var(--cream) 45%, #ede4d6 100%);
      overflow-x: hidden;
    }

    .app {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(16px + var(--safe-top)) 18px calc(88px + var(--safe-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .brand {
      font-family: var(--font-brand);
      font-size: clamp(3rem, 13vw, 4rem);
      line-height: 1;
      letter-spacing: 0.06em;
    }

    .wear-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(250, 247, 242, 0.75);
      backdrop-filter: blur(8px);
      color: var(--ink-soft);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .wear-btn.on { background: var(--leaf); color: #fff; border-color: transparent; }

    .tagline {
      font-size: 0.98rem;
      color: var(--ink-soft);
      margin-bottom: 20px;
    }

    .screen { display: none; animation: fadeIn 0.35s ease; }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .section-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 18px 0 10px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .cat-card {
      border: none;
      border-radius: var(--radius);
      padding: 16px 14px;
      background: rgba(250, 247, 242, 0.92);
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .cat-card:active { transform: scale(0.97); }
    .cat-card .icon { font-size: 1.8rem; display: block; margin-bottom: 6px; }
    .cat-card .name { font-weight: 600; font-size: 0.95rem; }
    .cat-card .gb { font-size: 0.72rem; color: var(--ink-soft); margin-top: 4px; }

    .report-list { display: flex; flex-direction: column; gap: 10px; }

    .report-card {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 14px;
      background: rgba(250, 247, 242, 0.9);
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .report-card img, .report-card .thumb-ph {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--cream-deep);
      flex-shrink: 0;
    }
    .report-card .meta { flex: 1; min-width: 0; }
    .report-card .meta h4 { font-size: 0.92rem; font-weight: 600; }
    .report-card .meta p { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      color: #fff;
      flex-shrink: 0;
    }
    .badge.pass { background: var(--leaf); }
    .badge.fail { background: var(--fail); }

    .inspect-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .back-btn {
      border: none;
      background: rgba(250, 247, 242, 0.9);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .inspect-title { font-size: 1.15rem; font-weight: 700; }

    .camera-zone {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: #111;
      aspect-ratio: 4/3;
      box-shadow: var(--shadow);
    }
    .camera-zone video, .camera-zone canvas, .camera-zone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.85);
      gap: 8px;
      font-size: 0.9rem;
    }
    .camera-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: var(--leaf); color: #fff; }
    .btn-secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .checklist { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(250, 247, 242, 0.92);
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .check-item input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--leaf); }
    .check-item label { flex: 1; font-size: 0.88rem; line-height: 1.45; cursor: pointer; }
    .check-item.auto { border-color: rgba(45, 143, 94, 0.25); }
    .check-item .auto-tag {
      font-size: 0.68rem;
      color: var(--leaf);
      background: rgba(45, 143, 94, 0.12);
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
    }

    .result-card {
      border-radius: var(--radius);
      padding: 24px 20px;
      text-align: center;
      background: rgba(250, 247, 242, 0.95);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .result-score {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1;
      margin: 8px 0;
    }
    .result-grade {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .result-summary { margin-top: 12px; font-size: 0.9rem; color: var(--ink-soft); line-height: 1.5; }
    .fail-list {
      text-align: left;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(192, 57, 43, 0.08);
      font-size: 0.85rem;
      color: var(--fail);
    }
    .fail-list ul { margin: 8px 0 0 18px; }
    .gb-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; justify-content: center; }
    .gb-tag {
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--cream-deep);
      color: var(--ink-soft);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .metric {
      padding: 10px;
      border-radius: 12px;
      background: var(--paper);
      font-size: 0.78rem;
    }
    .metric strong { display: block; font-size: 1rem; margin-top: 2px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      transform: translateX(-50%) translateY(80px);
      background: rgba(26, 22, 18, 0.88);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .empty {
      text-align: center;
      padding: 28px 16px;
      color: var(--ink-soft);
      font-size: 0.88rem;
    }

    input[type="file"] { display: none; }

    .quality-banner {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.84rem;
      line-height: 1.45;
      display: none;
    }
    .quality-banner.show { display: block; }
    .quality-banner.warn {
      background: rgba(196, 122, 0, 0.12);
      border: 1px solid rgba(196, 122, 0, 0.28);
      color: #8a5a00;
    }
    .quality-banner.ok {
      background: rgba(45, 143, 94, 0.1);
      border: 1px solid rgba(45, 143, 94, 0.22);
      color: var(--leaf-deep);
    }
    .quality-banner strong { display: block; margin-bottom: 4px; }
    .quality-banner ul { margin: 6px 0 0 18px; }

    @media (max-width: 280px), (max-height: 300px) {
      .brand { font-size: 2rem; }
      .tagline { font-size: 0.78rem; }
      .cat-grid { grid-template-columns: 1fr; }
      .app { padding-left: 12px; padding-right: 12px; }
      .result-score { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">食好好</h1>
      <button type="button" class="wear-btn" id="wearBtn" aria-label="穿戴传感">⌚</button>
    </header>
    <p class="tagline">对照国标，快检食物是否合格</p>

    <!-- Home -->
    <section class="screen active" id="screenHome">
      <h2 class="section-title">选择检测品类</h2>
      <div class="cat-grid" id="catGrid"></div>
      <h2 class="section-title">最近报告</h2>
      <div class="report-list" id="reportList"></div>
      <div class="empty" id="emptyReports" hidden>尚无检测记录，选品类开始第一次质检</div>
    </section>

    <!-- Inspect -->
    <section class="screen" id="screenInspect">
      <div class="inspect-header">
        <button type="button" class="back-btn" id="backFromInspect" aria-label="返回">←</button>
        <div>
          <div class="inspect-title" id="inspectCatName">检测</div>
          <div style="font-size:0.78rem;color:var(--ink-soft)" id="inspectGb"></div>
        </div>
      </div>
      <div class="camera-zone" id="cameraZone">
        <canvas id="previewCanvas" hidden></canvas>
        <img id="previewImg" alt="检测样图" hidden />
        <div class="camera-placeholder" id="cameraPlaceholder">
          <span style="font-size:2rem">📷</span>
          <span>拍摄或上传样品照片</span>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" />
      <div class="camera-actions">
        <button type="button" class="btn btn-secondary" id="pickPhotoBtn">选图 / 拍照</button>
        <button type="button" class="btn btn-primary" id="analyzeBtn" disabled>开始分析</button>
      </div>
      <div class="quality-banner" id="qualityBanner" role="status"></div>
      <div class="checklist" id="checklist"></div>
      <button type="button" class="btn btn-primary" id="submitInspectBtn" style="width:100%;margin-top:16px" disabled>
        生成质检报告
      </button>
    </section>

    <!-- Result -->
    <section class="screen" id="screenResult">
      <div class="inspect-header">
        <button type="button" class="back-btn" id="backFromResult" aria-label="返回">←</button>
        <div class="inspect-title">质检报告</div>
      </div>
      <div class="result-card" id="resultCard"></div>
      <button type="button" class="btn btn-primary" id="doneBtn" style="width:100%">完成</button>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <canvas id="analysisCanvas" hidden></canvas>
  <script src="js/app.js"></script>
</body>
</html>
